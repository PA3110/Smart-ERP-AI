<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f8f9ff;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-primary": "#bac7e1", "on-surface": "#0b1c30", "primary-fixed-dim": "#bac7e1", "on-tertiary-container": "#009668", "on-error-container": "#93000a", "on-secondary-fixed": "#001d31", "surface-bright": "#f8f9ff", "primary-container": "#0e1c2f", "tertiary-container": "#002113", "tertiary-fixed-dim": "#4edea3", "background": "#f8f9ff", "surface-container-low": "#eff4ff", "surface-tint": "#525f75", "primary-fixed": "#d6e3fe", "on-secondary-container": "#00476e", "error-container": "#ffdad6", "outline": "#75777d", "inverse-on-surface": "#eaf1ff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "surface-container-highest": "#d3e4fe", "on-secondary-fixed-variant": "#004b73", "on-background": "#0b1c30", "surface-variant": "#d3e4fe", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#002113", "on-tertiary-fixed-variant": "#005236", "on-primary-fixed-variant": "#3a475c", "secondary-container": "#5bb8fe", "surface-container": "#e5eeff", "on-primary-fixed": "#0e1c2f", "outline-variant": "#c5c6cd", "secondary-fixed": "#cce5ff", "on-error": "#ffffff", "on-primary": "#ffffff", "error": "#ba1a1a", "secondary-fixed-dim": "#93ccff", "surface-dim": "#cbdbf5", "tertiary-fixed": "#6ffbbe", "on-primary-container": "#77849c", "on-surface-variant": "#44474c", "inverse-surface": "#213145", "surface-container-high": "#dce9ff", "primary": "#000000", "surface": "#f8f9ff", "secondary": "#006398", "tertiary": "#000000" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-sm": "0.5rem", "space-xl": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "gutter-mobile": "0.5rem", "space-lg": "1rem", "margin": "1.5rem", "space-md": "0.75rem", "margin-mobile": "0.75rem" }, fontFamily: { "label-lg": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"], "headline-lg": ["Hanken Grotesk"], "headline-xl": ["Hanken Grotesk"], "headline-md": ["Hanken Grotesk"], "headline-lg-mobile": ["Hanken Grotesk"], "headline-xl-mobile": ["Hanken Grotesk"], "label-md": ["JetBrains Mono"], "body-lg": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"], "label-sm": ["JetBrains Mono"] }, fontSize: { "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg-mobile": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-xl-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["11px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500" }] } } } };</script>
<title>Vivek Mart — Big Billion Days</title>
<style>body{min-height:max(884px,100dvh);} .modal-backdrop{position:fixed;inset:0;background:rgba(11,28,48,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}</style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased">

<header class="fixed top-0 w-full z-40 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(11,28,48,0.06)]">
  <div class="px-gutter-mobile py-space-sm flex items-center justify-between gap-space-sm">
    <div class="flex items-center gap-space-sm min-w-0">
      <div class="h-9 w-9 rounded-md bg-primary flex items-center justify-center shrink-0 font-headline-md text-headline-md text-on-primary">V</div>
      <div class="flex flex-col leading-none">
        <span class="font-label-lg text-label-lg text-on-surface">Vivek Mart</span>
        <span class="font-label-sm text-label-sm text-on-tertiary-container uppercase tracking-wider">Big Billion Days</span>
      </div>
    </div>
    <button id="btn-identity" class="flex items-center gap-1.5 bg-surface-container px-space-sm py-1.5 rounded-full">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">person</span>
      <span id="identity-label" class="font-label-sm text-label-sm text-on-surface-variant">Sign in</span>
    </button>
  </div>
</header>

<main class="flex-1 flex flex-col w-full pt-20 pb-10 bg-surface px-margin-mobile">
  <div class="bg-primary rounded-xl p-space-md mb-space-md flex flex-col gap-1">
    <span class="font-label-sm text-label-sm text-tertiary-fixed-dim uppercase tracking-wider">⚡ Live now</span>
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary font-bold">Deals so big, stock runs out in seconds</h1>
    <p class="font-body-sm text-body-sm text-primary-fixed-dim">Real-time inventory — once it's gone, it's gone. Fair queue for everyone.</p>
  </div>

  <h2 class="font-headline-md text-headline-md text-on-surface mb-space-sm">⚡ Flash Deals</h2>
  <div id="flash-grid" class="grid grid-cols-1 gap-space-md mb-space-lg"></div>

  <h2 class="font-headline-md text-headline-md text-on-surface mb-space-sm">Also on sale</h2>
  <div id="catalog-grid" class="grid grid-cols-2 gap-space-sm"></div>
</main>

<div id="identity-modal" class="modal-backdrop hidden">
  <div class="bg-surface-container-lowest w-full rounded-t-xl p-space-lg flex flex-col gap-space-sm">
    <h3 class="font-headline-md text-headline-md text-on-surface">Sign in to buy</h3>
    <p class="font-body-sm text-body-sm text-on-surface-variant">Just your name and city — this is a demo storefront, not a real checkout.</p>
    <label class="flex flex-col gap-1">
      <span class="font-label-sm text-label-sm text-on-surface-variant">Full name</span>
      <input id="in-name" type="text" placeholder="e.g. Ananya Sharma" class="h-11 px-3 rounded-lg border border-outline-variant font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary"/>
    </label>
    <label class="flex flex-col gap-1">
      <span class="font-label-sm text-label-sm text-on-surface-variant">City</span>
      <select id="in-city" class="h-11 px-3 rounded-lg border border-outline-variant font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary">
        <option>Bangalore</option><option>Hyderabad</option><option>Chennai</option><option>Delhi</option><option>Mumbai</option><option>Kolkata</option><option>Pune</option><option>Ahmedabad</option>
      </select>
    </label>
    <button id="btn-save-identity" class="w-full bg-primary text-on-primary rounded-lg py-space-sm font-label-lg text-label-lg mt-space-xs">Continue</button>
  </div>
</div>

<script>
function getIdentity() { try { return JSON.parse(localStorage.getItem('vivekCustomer')); } catch { return null; } }
function setIdentity(name, city) { localStorage.setItem('vivekCustomer', JSON.stringify({ name, city })); renderIdentity(); }
function renderIdentity() {
  const id = getIdentity();
  document.getElementById('identity-label').textContent = id ? id.name.split(' ')[0] + ' · ' + id.city : 'Sign in';
}
document.getElementById('btn-identity').addEventListener('click', () => document.getElementById('identity-modal').classList.remove('hidden'));
document.getElementById('btn-save-identity').addEventListener('click', () => {
  const name = document.getElementById('in-name').value.trim();
  const city = document.getElementById('in-city').value;
  if (!name) return;
  setIdentity(name, city);
  document.getElementById('identity-modal').classList.add('hidden');
});
renderIdentity();

function stars(rating) {
  const full = Math.round(rating || 0);
  return '★'.repeat(full) + '☆'.repeat(5 - full);
}

function card(p, big) {
  const priceBlock = `
    <div class="flex items-baseline gap-1.5">
      <span class="font-headline-md text-headline-md font-bold text-on-surface">₹${p.unit_price.toLocaleString('en-IN')}</span>
      ${p.mrp ? `<span class="font-label-sm text-label-sm text-on-surface-variant line-through">₹${p.mrp.toLocaleString('en-IN')}</span>` : ''}
      ${p.discountPct ? `<span class="font-label-sm text-label-sm text-on-tertiary-container font-semibold">${p.discountPct}% off</span>` : ''}
    </div>`;
  const urgency = p.is_flash_deal
    ? (p.available === 0
        ? `<span class="font-label-sm text-label-sm text-error font-semibold">Sold out — join waitlist</span>`
        : `<span class="font-label-sm text-label-sm text-error font-semibold">Only ${p.available} left!</span>`)
    : `<span class="font-label-sm text-label-sm text-on-tertiary-container">In stock</span>`;
  return `
    <a href="/product.html?id=${p.id}" class="bg-surface-container-lowest rounded-xl shadow-sm p-space-md flex ${big ? 'flex-row items-center gap-space-md' : 'flex-col gap-1'} no-underline text-inherit">
      <div class="${big ? 'text-6xl' : 'text-4xl'} shrink-0">${p.emoji || '🛒'}</div>
      <div class="flex flex-col gap-1 min-w-0">
        <span class="font-label-lg text-label-lg text-on-surface line-clamp-2">${p.name}</span>
        <span class="font-label-sm text-label-sm text-on-tertiary-container">${stars(p.rating)} <span class="text-on-surface-variant">(${(p.review_count||0).toLocaleString('en-IN')})</span></span>
        ${priceBlock}
        ${urgency}
      </div>
    </a>`;
}

async function loadCatalog() {
  const res = await fetch('/storefront/products');
  const products = await res.json();
  const flash = products.filter(p => p.is_flash_deal);
  const rest = products.filter(p => !p.is_flash_deal);
  document.getElementById('flash-grid').innerHTML = flash.map(p => card(p, true)).join('');
  document.getElementById('catalog-grid').innerHTML = rest.map(p => card(p, false)).join('');
}
loadCatalog();
setInterval(loadCatalog, 4000);
</script>
</body>
</html>
